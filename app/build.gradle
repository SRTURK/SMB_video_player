plugins { id 'com.android.application' }
android {
    namespace 'cn.lanvideo.app'
    compileSdk 36
    compileSdkExtension 20
    defaultConfig { applicationId 'cn.lanvideo.app'; minSdk 26; targetSdk 34; versionCode 6; versionName '0.4.1'; testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner' }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    signingConfigs {
        distribution {
            if (System.getenv('ANDROID_SIGNING_STORE_FILE')) {
                storeFile file(System.getenv('ANDROID_SIGNING_STORE_FILE'))
                storePassword System.getenv('ANDROID_SIGNING_STORE_PASSWORD')
                keyAlias System.getenv('ANDROID_SIGNING_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_SIGNING_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release { signingConfig signingConfigs.distribution; debuggable false }
        lab { initWith debug; applicationIdSuffix '.lab'; matchingFallbacks = ['debug'] } }
    testBuildType project.hasProperty('deviceLab') ? 'lab' : 'debug'
    packaging { resources.excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*'] }
}
dependencies {
    implementation 'androidx.media3:media3-exoplayer:1.3.1'
    implementation 'androidx.media3:media3-ui:1.3.1'
    implementation 'eu.agno3.jcifs:jcifs-ng:2.1.10'
    implementation 'org.slf4j:slf4j-nop:1.7.36'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.5.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
}
